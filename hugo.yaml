  profileMode:
    enabled: true
    title: "Raveesh Mayya"
    subtitle: >
      I'm an Assistant Professor of Technology, Operations, and Statistics
      at NYU Stern School of Business. My research examines two forces reshaping the
      digital economy: (a) how generative AI transforms knowledge work and collaborative
      innovation, including who it empowers and how reliably it performs, and
      (b) how digital platform policy changes create unintended consequences,
      particularly privacy policies that reshape the way firms acquire consumer
      data, from permission systems to registration walls.
      I am the founding co-organizer of the [Workshop on AI and Collaborative
      Innovation (WAICI)](https://ai-conference.github.io/).
    imageUrl: "/images/raveesh-mayya-nyu-stern.jpg"
    imageTitle: "Raveesh Mayya"
    imageWidth: 160
    imageHeight: 160
