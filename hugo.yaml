    title: "Raveesh Mayya"
    subtitle: |
      I'm an Assistant Professor of Technology, Operations, and Statistics (TOpS) at NYU Stern School of Business.

      **GenAI and Innovation:** I study how generative AI transforms collaboration and innovation, especially in the knowledge economy.

      **Platform Policy & Privacy:** I study the unintended consequences of platform policy changes, with special interest in privacy policies that reshape how firms acquire consumer data, from permission systems to registration walls.

      **Community:** I am the founding co-organizer of the [Workshop on AI and Collaborative Innovation (WAICI)](https://ai-conference.github.io/) and the founding organizer of the [ISPOC Series](https://ispoc-series.github.io/).
